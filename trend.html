<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トレンド｜ISAM 情報セキュリティ学術研究マップ</title>
    <meta name="description" content="CSS・SCIS の論文タイトルに含まれるキーワードの年ごとの推移（件数・割合）を折れ線グラフで表示します。">

    <!-- テーマ(ダーク/ライト)を描画前に適用: 保存値 → OS設定 → ダーク -->
    <script>
        (function () {
            var theme = 'dark';
            try {
                var saved = localStorage.getItem('isam-theme');
                if (saved === 'light' || saved === 'dark') {
                    theme = saved;
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                    theme = 'light';
                }
            } catch (e) {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/trend.css">
</head>
<body>
    <div class="bg-glow-container">
        <div class="bg-glow bg-glow-1"></div>
        <div class="bg-glow bg-glow-2"></div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="app-topbar">
                <a class="back-link" href="index.html">&larr; 論文検索に戻る</a>
                <!-- テーマ切替スイッチ (ダーク/ライト) -->
                <button type="button" id="theme-toggle" class="theme-toggle" role="switch" aria-checked="true" aria-label="ダークモード" title="ダークモード / ライトモードを切り替え">
                    <span class="theme-toggle-label" id="theme-toggle-label">ダーク</span>
                    <span class="theme-toggle-track" aria-hidden="true">
                        <span class="theme-toggle-thumb"></span>
                        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                        </svg>
                        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                        </svg>
                    </span>
                </button>
            </div>

            <div class="logo-area">
                <span class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M3 17l5-6 4 3 8-9M15 5h5v5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
                <h1>ISAM <span class="subtitle">Trend</span></h1>
            </div>
            <p class="tagline">キーワード別の年次推移（論文タイトル）</p>
        </header>

        <main class="search-dashboard">
            <!-- 操作パネル -->
            <section class="search-control-panel tr-controls" aria-label="キーワードと表示の設定">
                <form class="tr-add" id="tr-form" autocomplete="off">
                    <label for="tr-input" class="tr-label">キーワード（最大6語。<code>|</code> で同義語を束ねる 例: <code>量子|quantum</code>）</label>
                    <div class="tr-add-row">
                        <input type="text" id="tr-input" class="tr-input" placeholder="例: 量子|quantum" enterkeyhint="done">
                        <button type="submit" class="tr-btn tr-btn-primary">追加</button>
                    </div>
                </form>

                <div class="tr-presets">
                    <span class="tr-label">よく使う語</span>
                    <div class="tr-preset-list" id="tr-presets" role="group" aria-label="おすすめのキーワード"></div>
                </div>

                <div class="tr-options">
                    <div class="tr-field">
                        <span class="tr-label" id="tr-unit-label">縦軸</span>
                        <div class="tr-seg" role="radiogroup" aria-labelledby="tr-unit-label">
                            <label><input type="radio" name="tr-unit" value="count" checked><span>件数</span></label>
                            <label><input type="radio" name="tr-unit" value="ratio"><span>割合（100件あたり）</span></label>
                        </div>
                    </div>
                    <div class="tr-field">
                        <span class="tr-label" id="tr-conf-label">対象</span>
                        <div class="tr-seg" role="radiogroup" aria-labelledby="tr-conf-label">
                            <label><input type="radio" name="tr-conf" value="all" checked><span>CSS+SCIS</span></label>
                            <label><input type="radio" name="tr-conf" value="css"><span>CSSのみ</span></label>
                            <label><input type="radio" name="tr-conf" value="scis"><span>SCISのみ</span></label>
                        </div>
                    </div>
                    <div class="tr-field">
                        <label class="tr-label" for="tr-from">期間</label>
                        <div class="tr-range">
                            <select id="tr-from" class="sort-select tr-select" aria-label="開始年"></select>
                            <span aria-hidden="true">〜</span>
                            <select id="tr-to" class="sort-select tr-select" aria-label="終了年"></select>
                        </div>
                    </div>
                </div>
            </section>

            <!-- グラフ -->
            <section class="tr-stage" aria-live="polite">
                <div class="tr-legend" id="tr-legend" aria-label="凡例"></div>
                <div class="tr-chart-wrap" id="tr-chart-wrap">
                    <div id="tr-chart"></div>
                    <div class="tr-tooltip hide" id="tr-tooltip" role="status"></div>
                    <div class="tr-message hide" id="tr-message"></div>
                </div>
                <p class="tr-hint" id="tr-hint"></p>
            </section>

            <!-- 数値表 (色や形に頼らず数値でも確認できる) -->
            <details class="tr-table-details" id="tr-table-details">
                <summary>数値表を表示</summary>
                <div class="tr-table-actions">
                    <button type="button" class="tr-btn" id="tr-csv">CSVをダウンロード</button>
                </div>
                <div class="tr-table-scroll">
                    <table class="tr-table" id="tr-table"></table>
                </div>
            </details>
        </main>

        <footer class="app-footer">
            <p>集計対象: 各回の論文タイトル（特別講演・企画などを除く） ／ 割合 = 該当タイトル数 ÷ その年の論文数 × 100</p>
        </footer>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/trend.js"></script>
</body>
</html>
